services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lead-agent
    ports:
      - "8990:8000"
    volumes:
      - ./app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
